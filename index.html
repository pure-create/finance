<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>finance</title>
<script src="common/analytics.js?v=20260805a" async></script>
<script src="common/theme.js?v=20260805a"></script>
<link rel="stylesheet" href="common/theme.css?v=20260805a">
<link rel="stylesheet" href="common/site.css?v=20260805f">
<style>
  /* 各ツールの識別色。データと結び付いた色なのでテーマ共通トークンには含めない */
  :root {
    --tint: 6%;
    --edge-asset: #0d9488;
    --edge-nisa: #16a34a;
    --edge-retire: #d97706;
    --edge-pension: #2563eb;
    --edge-inherit: #8b5cf6;
  }
  /* ダーク側。theme.css と同じく2箇所に同じ値を書いている（片方だけ直さないこと） */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --tint: 12%;
      --edge-asset: #2dd4bf;
      --edge-nisa: #4ade80;
      --edge-retire: #fbbf24;
      --edge-pension: #60a5fa;
      --edge-inherit: #a78bfa;
    }
  }
  :root[data-theme="dark"] {
    --tint: 12%;
    --edge-asset: #2dd4bf;
    --edge-nisa: #4ade80;
    --edge-retire: #fbbf24;
    --edge-pension: #60a5fa;
    --edge-inherit: #a78bfa;
  }

  body {
    padding: 2rem 1rem 3rem;
    font-size: 16px;
    line-height: 1.7;
  }

  main { max-width: 680px; margin: 0 auto; }

  .page-head { align-items: center; }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--edge, var(--border));
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }

  /* 対応ブラウザだけ、枠線の色をごく薄く背景に敷く */
  @supports (background: color-mix(in srgb, red 5%, white)) {
    .item { background: color-mix(in srgb, var(--edge, var(--surface)) var(--tint), var(--surface)); }
  }

  .item-asset   { --edge: var(--edge-asset); }
  .item-nisa    { --edge: var(--edge-nisa); }
  .item-retire  { --edge: var(--edge-retire); }
  .item-pension { --edge: var(--edge-pension); }
  .item-inherit { --edge: var(--edge-inherit); }

  .item h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 .5rem;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .links li + li { margin-top: .15rem; }

  .links a {
    display: inline-block;
    text-decoration: none;
    padding: .1rem 0;
  }

  .links a::before {
    content: "→";
    color: var(--edge, var(--accent));
    margin-right: .45em;
  }

  .links a:hover { text-decoration: underline; }

  .desc {
    color: var(--muted);
    font-size: .875rem;
    line-height: 1.6;
    margin: .6rem 0 0;
  }

  /* QRコードは読み取り精度のためテーマで反転させない（白地・黒モジュールのまま） */
  .qr {
    display: block;
    flex-shrink: 0;
    background: var(--qr-bg);
    padding: 4px;
    border-radius: 4px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <div class="page-title">
      <h1>金融データ・計算ツール</h1>
    </div>
    <div class="page-tools">
      <span data-theme-toggle></span>
      <img class="qr" src="url.png" width="64" height="64" alt="このサイトのURLのQRコード">
    </div>
  </div>

  <section class="item item-asset">
    <h2>資産運用</h2>
    <ul class="links">
      <li><a href="assetSimulator/">資産運用シミュレーター</a></li>
    </ul>
    <p class="desc">積立と取り崩しをモンテカルロ法でシミュレーションし、将来の資産推移を試算</p>
  </section>

  <section class="item item-nisa">
    <h2>NISA利用状況</h2>
    <ul class="links">
      <li><a href="nisa/nisa2025.html">2025年末</a></li>
      <li><a href="nisa/nisa2024.html">2024年末</a></li>
    </ul>
    <p class="desc">金融庁のNISA利用状況データと人口データから作成</p>
  </section>

  <section class="item item-retire">
    <h2>公務員退職手当計算</h2>
    <ul class="links">
      <li><a href="retirement/local/">地方公務員</a></li>
      <li><a href="retirement/national/">国家公務員</a></li>
    </ul>
    <p class="desc">基本給や採用年度等から退職手当、税金や手取額を計算</p>
  </section>

  <section class="item item-pension">
    <h2>年金</h2>
    <ul class="links">
      <li><a href="pension_breakeven.html">受給開始年齢別シミュレーター</a></li>
    </ul>
    <p class="desc">金利を考慮した年金受給開始年齢別シミュレーター</p>
  </section>

  <section class="item item-inherit">
    <h2>相続</h2>
    <ul class="links">
      <li><a href="inheritance/">二次相続シミュレーター</a></li>
    </ul>
    <p class="desc">一次相続と二次相続の相続税を合計で比較し、税額が最小となる取得割合を計算</p>
  </section>
</main>
</body>
</html>
