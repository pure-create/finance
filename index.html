<meta charset="UTF-8">

<title>finance</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --card: #ffffff;
    --accent: #0b66c3;
    --accent-soft: #9db9d8;
    --tint: 6%;
    --edge-nisa: #16a34a;
    --edge-retire: #d97706;
    --edge-pension: #2563eb;
    --edge-inherit: #8b5cf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --line: #2c3036;
      --card: #1d2025;
      --accent: #6db3f2;
      --accent-soft: #4a708f;
      --tint: 12%;
      --edge-nisa: #4ade80;
      --edge-retire: #fbbf24;
      --edge-pension: #60a5fa;
      --edge-inherit: #a78bfa;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem 3rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }

  main { max-width: 680px; margin: 0 auto; }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: .02em;
    margin: 0;
  }

  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--edge, var(--line));
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }

  /* 対応ブラウザだけ、枠線の色をごく薄く背景に敷く */
  @supports (background: color-mix(in srgb, red 5%, white)) {
    .item { background: color-mix(in srgb, var(--edge, var(--card)) var(--tint), var(--card)); }
  }

  .item-nisa    { --edge: var(--edge-nisa); }
  .item-retire  { --edge: var(--edge-retire); }
  .item-pension { --edge: var(--edge-pension); }
  .item-inherit { --edge: var(--edge-inherit); }

  .item h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 .5rem;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .links li + li { margin-top: .15rem; }

  .links a {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    padding: .1rem 0;
  }

  .links a::before {
    content: "→";
    color: var(--edge, var(--accent-soft));
    margin-right: .45em;
  }

  .links a:hover { text-decoration: underline; }

  .links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .desc {
    color: var(--muted);
    font-size: .875rem;
    line-height: 1.6;
    margin: .6rem 0 0;
  }

  .qr {
    display: block;
    flex-shrink: 0;
    background: #fff;
    padding: 4px;
    border-radius: 4px;
  }
</style>
</head>
<body>
<main>
  <header class="page-head">
    <h1>金融データ・計算ツール</h1>
    <img class="qr" src="url.png" width="64" height="64" alt="このサイトのURLのQRコード">
  </header>

  <section class="item item-nisa">
    <h2>NISA利用状況</h2>
    <ul class="links">
      <li><a href="nisa/nisa2025.html">2025年末</a></li>
      <li><a href="nisa/nisa2024.html">2024年末</a></li>
    </ul>
    <p class="desc">金融庁のNISA利用状況データと人口データから作成</p>
  </section>

  <section class="item item-retire">
    <h2>公務員退職手当計算</h2>
    <ul class="links">
      <li><a href="retirement/local/">地方公務員</a></li>
      <li><a href="retirement/national/">国家公務員</a></li>
    </ul>
    <p class="desc">基本給や採用年度等から退職手当、税金や手取額を計算</p>
  </section>

  <section class="item item-pension">
    <h2>年金</h2>
    <ul class="links">
      <li><a href="pension_breakeven.html">受給開始年齢別シミュレーター</a></li>
    </ul>
    <p class="desc">金利を考慮した年金受給開始年齢別シミュレーター</p>
  </section>

  <section class="item item-inherit">
    <h2>相続</h2>
    <ul class="links">
      <li><a href="inheritance">二次相続シミュレーター</a></li>
    </ul>
    <p class="desc">一次相続と二次相続の相続税を合計で比較し、税額が最小となる取得割合を計算</p>
  </section>
</main>
</body>
</html>
