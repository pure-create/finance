<!DOCTYPE html>
<html lang="ja">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BJ9WKQKN9V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-BJ9WKQKN9V');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="地方公務員・国家公務員向けの退職手当（退職金）を試算できる無料計算サイトです。">
<script src="./js/qrcode.js?v=20260731a"></script>
<title>退職手当計算サイト</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "メイリオ", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: #1e293b;
    margin: 0;
    padding: 32px clamp(16px, 4vw, 56px);
    background: #f8fafc;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p.lead {
    font-size: 13px;
    color: #64748b;
    margin: 0 0 20px;
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  a.card {
    position: relative;
    display: block;
    width: 200px;
    height: 84px;
    padding: 16px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover {
    border-color: #4f46e5;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
  }
  a.card .title {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 17px;
    font-weight: 700;
    color: #4f46e5;
  }
  a.card .qr {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: block;
    width: 56px;
    height: 56px;
    line-height: 0;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 4px;
  }
  a.card .qr svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<h1>退職手当計算サイト</h1>
<p class="lead">地方公務員・国家公務員向けに、退職手当や税金・手取額を試算できます。</p>
<div class="cards">
	<a class="card" href="./local/">
		<span class="title">地方公務員</span>
		<span class="qr" id="qrLocal" aria-hidden="true"></span>
	</a>
	<a class="card" href="./national/">
		<span class="title">国家公務員</span>
		<span class="qr" id="qrNational" aria-hidden="true"></span>
	</a>
</div>
<script>
	function renderQr(elId, relativePath){
		var el = document.getElementById(elId);
		if(!el) return;
		try{
			var url = new URL(relativePath, window.location.href).href;
			var qr = qrcode(0, 'M');
			qr.addData(url);
			qr.make();
			el.innerHTML = qr.createSvgTag(4);
		}catch(e){
			el.innerHTML = '';
		}
	}
	renderQr('qrLocal', './local/');
	renderQr('qrNational', './national/');
</script>
</body>
</html>
