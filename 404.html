<style>
  body {
    padding: 1.25rem 1rem 1.75rem;
    font-size: 16px;
    line-height: 1.6;
  }

  /* 本文の幅は年金・相続・NISAと揃えて840px */
  main { max-width: 840px; margin: 0 auto; }

  .lead { margin: 0 0 .6rem; }

  .hint {
    color: var(--muted);
    font-size: .875rem;
    line-height: 1.7;
    margin: 0 0 1.4rem;
  }

  /* サイト全体の構成をそのまま出す。行き先を選び直せるだけでなく、
     どこに何があるかが分かるようにするため、トップページを根に置いた木にしている。

     枝の線は罫線素片（├ └）ではなく、入れ子の <ul> に対してCSSで引いている。
     文字で描くと読み上げに混ざり、コピーしたときにも付いてくるため。
     縦線は各項目の ::before、横線は ::after。最後の子だけ縦線を途中で止めて
     「└」の形にする。 */
  .tree,
  .tree ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .tree li { line-height: 1.9; }

  /* 子の階層。左に枝を引くぶんの幅を空ける */
  .tree ul { margin-left: .5em; }
  .tree ul > li { position: relative; padding-left: 1.5em; }

  .tree ul > li::before {   /* 縦線 */
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--axis);
  }
  .tree ul > li:last-child::before { bottom: auto; height: .95em; }

  .tree ul > li::after {    /* 横線。文字の中心（line-height 1.9 の半分）に合わせる */
    content: "";
    position: absolute;
    left: 0;
    top: .95em;
    width: 1em;
    border-top: 1px solid var(--axis);
  }

  .tree a { text-decoration: none; }
  .tree a:hover { text-decoration: underline; }

  /* 根（トップページ）。ここが起点だと分かるように少し強くする */
  .tree > li > a { font-weight: 600; }

  /* ページを持たない区分の見出し。NISAは各年のページがあるだけで、
     まとめのページを持っていないのでリンクにしない */
  .tree .branch { color: var(--text-sub); }
</style>
</head>

<main>

  <!-- サイトの構成をそのまま木にしたもの。ページを増やしたときはここにも足すこと -->
  <ul class="tree">

      <ul>

</main>

</html>
