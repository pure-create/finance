<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="地方公務員・国家公務員向けの退職手当（退職金）を試算できる無料計算サイトです。">
<!-- 共有時の見え方（OGP）とURLの正規化。SNSの巡回はJSを実行しないため各ページに直接書く。
     og:image はツール別の1枚。版下は og/card.html（?v= で版を切り替えて書き出す） -->
<link rel="canonical" href="https://pure-create.github.io/finance/retirement/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="資産運用・金融シミュレーター">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://pure-create.github.io/finance/retirement/">
<meta property="og:title" content="退職手当計算サイト">
<meta property="og:description" content="地方公務員・国家公務員向けの退職手当（退職金）を試算できる無料計算サイトです。">
<meta property="og:image" content="https://pure-create.github.io/finance/og/retirement.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="公務員退職手当計算">
<meta name="twitter:card" content="summary_large_image">
<!-- ファビコン。自動で読まれる /favicon.ico はホスト直下しか見ず、プロジェクトページ配下の
     このサイトでは拾われないため明示する。type を解せるブラウザはSVG、それ以外は .ico を使う -->
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../common/analytics.js?v=20260805a" async></script>
<script src="../common/theme.js?v=20260807a"></script>
<link rel="stylesheet" href="../common/theme.css?v=20260808b">
<link rel="stylesheet" href="../common/site.css?v=20260809a">
<script src="../common/qrcode.js?v=20260805a"></script>
<script src="../common/share.js?v=20260808a"></script>
<title>退職手当計算サイト</title>
<style>
  body {
    font-size: 15px;
    line-height: 1.8;
    /* 幅は地方・国家のページ（css/main.css）と揃える。
       入口からそれらへ移ったときに見出しの位置が動かないようにするため */
    max-width: 1220px;
    margin: 0 auto;
    padding: 24px clamp(16px, 4vw, 56px);
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  a.card {
    position: relative;
    display: block;
    width: 200px;
    height: 84px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }
  a.card .title {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="site-head">
	<a class="home-link" href="../">トップページに戻る</a>
	<div class="page-tools">
		<span data-theme-toggle></span>
		<div class="share-wrap">
			<button class="share-btn" id="shareBtn" type="button" aria-expanded="false" aria-controls="sharePop">URLを共有</button>
			<div class="share-pop" id="sharePop">
				<span id="shareQr" class="share-qr" aria-hidden="true" title="スマートフォンのカメラで読み取ると、このページが開けます"></span>
				<p id="shareMsg" class="share-msg" aria-live="polite"></p>
			</div>
		</div>
	</div>
</div>
<div class="page-head">
	<div class="page-title">
		<h1>退職手当計算サイト</h1>
		<p class="sub">地方公務員・国家公務員向けに、退職手当や税金・手取額を試算できます。</p>
	</div>
</div>
<div class="cards">
	<a class="card" href="./local/">
		<span class="title">地方公務員</span>
	</a>
	<a class="card" href="./national/">
		<span class="title">国家公務員</span>
	</a>
</div>
<p class="site-privacy">※ アクセス状況の把握に Google Analytics を利用しています（<a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Googleによるデータ使用について</a>）。</p>
<script>
	/* 入口のページなので、共有するのはクエリの付かないこのページのURLそのもの
	   （トップページと同じ形。JSモジュールを持たないページなのでここで初期化する）。

	   以前は2枚のカードの中に、地方・国家それぞれのQRを常時表示していた。
	   他のページはどこも「共有ボタンを押したときだけQRの窓が開く」形なので、
	   このページだけ作りが違っていた。カードからQRを外し、ヘッダーの
	   共有ボタンに寄せている */
	Share.init({
		buildUrl: function () { return Share.urlWithParams(null); },
		okMsg:    'このページのURLをコピーしました。'
	});
</script>
</body>
</html>
