<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="地方公務員・国家公務員向けの退職手当（退職金）を試算できる無料計算サイトです。">
<!-- 共有時の見え方（OGP）とURLの正規化。SNSの巡回はJSを実行しないため各ページに直接書く。
     og:image は画像を用意でき次第追加し、twitter:card を summary_large_image に変える -->
<link rel="canonical" href="https://pure-create.github.io/finance/retirement/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="資産運用・金融シミュレーター">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://pure-create.github.io/finance/retirement/">
<meta property="og:title" content="退職手当計算サイト">
<meta property="og:description" content="地方公務員・国家公務員向けの退職手当（退職金）を試算できる無料計算サイトです。">
<meta name="twitter:card" content="summary">
<script src="../common/analytics.js?v=20260805a" async></script>
<script src="../common/theme.js?v=20260807a"></script>
<link rel="stylesheet" href="../common/theme.css?v=20260807a">
<link rel="stylesheet" href="../common/site.css?v=20260808a">
<script src="../common/qrcode.js?v=20260805a"></script>
<title>退職手当計算サイト</title>
<style>
  body {
    font-size: 15px;
    line-height: 1.8;
    /* 幅は地方・国家のページ（css/main.css）と揃える。
       入口からそれらへ移ったときに見出しの位置が動かないようにするため */
    max-width: 1220px;
    margin: 0 auto;
    padding: 24px clamp(16px, 4vw, 56px);
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  a.card {
    position: relative;
    display: block;
    width: 200px;
    height: 84px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }
  a.card .title {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
  }
  /* QRコードは読み取り精度のためテーマで反転させない（白地・黒モジュールのまま） */
  a.card .qr {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: block;
    width: 56px;
    height: 56px;
    line-height: 0;
    background: var(--qr-bg);
    border: 1px solid var(--qr-border);
    border-radius: 6px;
    padding: 4px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  a.card .qr svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div class="site-head">
	<a class="home-link" href="../">トップページに戻る</a>
	<div class="page-tools">
		<span data-theme-toggle></span>
	</div>
</div>
<div class="page-head">
	<div class="page-title">
		<h1>退職手当計算サイト</h1>
		<p class="sub">地方公務員・国家公務員向けに、退職手当や税金・手取額を試算できます。</p>
	</div>
</div>
<div class="cards">
	<a class="card" href="./local/">
		<span class="title">地方公務員</span>
		<span class="qr" id="qrLocal" aria-hidden="true"></span>
	</a>
	<a class="card" href="./national/">
		<span class="title">国家公務員</span>
		<span class="qr" id="qrNational" aria-hidden="true"></span>
	</a>
</div>
<script>
	function renderQr(elId, relativePath){
		var el = document.getElementById(elId);
		if(!el) return;
		try{
			var url = new URL(relativePath, window.location.href).href;
			var qr = qrcode(0, 'M');
			qr.addData(url);
			qr.make();
			el.innerHTML = qr.createSvgTag(4);
		}catch(e){
			el.innerHTML = '';
		}
	}
	renderQr('qrLocal', './local/');
	renderQr('qrNational', './national/');
</script>
</body>
</html>
