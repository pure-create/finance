<style>
/* 地の色・文字・枠線などは common/theme.css の共通トークンを使う。
   ここで持つのは受給開始年齢ごとの識別色だけ。本文で「65歳開始（緑色）」と
   呼んでいるので、ダークでも色味は変えず明度だけ上げる。 */
:root{
  --sc-60:#2563eb; --sc-60-bg:#eff6ff;
  --sc-65:#059669; --sc-65-bg:#ecfdf5;
  --sc-70:#d97706; --sc-70-bg:#fffbeb;
  --sc-75:#dc2626; --sc-75-bg:#fef2f2;
  --switch-thumb:#ffffff; /* 色のついた面に載るのでテーマで変えない */
}
/* ダーク側。theme.css と同じく2箇所に同じ値を書いている（片方だけ直さないこと） */
@media(prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    --sc-60:#60a5fa; --sc-60-bg:#152238;
    --sc-65:#34d399; --sc-65-bg:#0f2a20;
    --sc-70:#fbbf24; --sc-70-bg:#2e2408;
    --sc-75:#f87171; --sc-75-bg:#301617;
  }
}
:root[data-theme="dark"]{
  --sc-60:#60a5fa; --sc-60-bg:#152238;
  --sc-65:#34d399; --sc-65-bg:#0f2a20;
  --sc-70:#fbbf24; --sc-70-bg:#2e2408;
  --sc-75:#f87171; --sc-75-bg:#301617;
}

*,*::before,*::after{margin:0;padding:0}
body{padding:16px;min-height:100vh}
.wrap{max-width:840px;margin:0 auto}
.page-head h1{font-size:17px;letter-spacing:-.02em}
.page-head .sub{font-size:11px}
.card{background:var(--surface);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}

/* 共有ボタン・QRコードの基本形は common/site.css にある。
   ここではこのページの文字サイズだけを調整する */
.share-btn{font-size:11px;font-weight:600;min-height:0;padding:5px 10px;white-space:nowrap}
@media screen and (max-width:600px){
  .share-btn{white-space:normal}
}

/* Controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media screen and (max-width:540px){.controls{grid-template-columns:1fr}}
.ctrl label{font-size:11px;font-weight:600;color:var(--text-sub);display:block;margin-bottom:7px}
.ctrl-head{display:flex;align-items:center;gap:14px;margin-bottom:7px}
.ctrl-head label{margin-bottom:0}

/* Help tooltip icon */
.help{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;border:1px solid var(--axis);background:var(--surface);
  color:var(--muted);font-size:10px;font-weight:700;cursor:help;flex-shrink:0;vertical-align:middle;margin-left:5px;
}
.help:hover,.help:focus-visible{border-color:var(--accent);color:var(--accent)}
.help .tipbox{width:260px;left:-12px;right:auto;line-height:1.7;padding:10px 12px;pointer-events:none}
.help .tipbox::before{left:14px;right:auto}
.srow{display:flex;align-items:center;gap:10px}
.srow input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.sval{font-size:22px;font-weight:700;color:var(--accent);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.ssub{font-size:10px;color:var(--muted);margin-top:4px}

/* Tax toggle (inline, next to 想定利回り) */
.ctrl-head label.tax-inline{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.switch{position:relative;width:26px;height:15px;flex-shrink:0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{position:absolute;inset:0;background:var(--axis);border-radius:8px;transition:background .2s}
.switch input:checked + .switch-track{background:var(--accent)}
.switch input:focus-visible + .switch-track{outline:2px solid var(--accent);outline-offset:2px}
.switch-thumb{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--switch-thumb);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(11px)}

/* Chart */
.chart-wrap{position:relative;height:370px}

/* Timeline */
.sec-title{font-size:13px;font-weight:700;color:var(--text-sub);margin-bottom:12px}
.timeline{display:flex;flex-direction:column;gap:6px}
.period{
  display:flex;align-items:center;gap:0;
  border-radius:8px;overflow:hidden;
  border-left:4px solid;
}
.period .age-col{
  font-size:12px;color:var(--text-sub);
  padding:9px 12px;min-width:190px;flex-shrink:0;
  border-right:1px solid var(--border);
  background:var(--surface);
}
.period .winner-col{
  font-size:13px;font-weight:700;
  padding:9px 14px;
}
@media screen and (max-width:480px){
  .period{flex-direction:column;align-items:flex-start}
  .period .age-col{border-right:none;border-bottom:1px solid var(--border);min-width:0;width:100%}
}

/* 印刷の直前にグラフを紙幅・紙の高さで描き直させるための指定（下の @media print と同じ値）。
   @media print は印刷レイアウトが確定してからしか効かず、描き直しに間に合わない */
html.printing body{padding:0}
html.printing .chart-wrap{height:280px}
html.printing .help,html.printing .switch{display:none !important}

/* 印刷。白地・黒文字への切り替えは common/theme.css の @media print が行う */
@media print{
  @page{margin:12mm}
  body{padding:0;font-size:10pt}
  .card{background:none;border:1px solid var(--border);box-shadow:none;break-inside:avoid}
  .help,.switch{display:none !important}
  .chart-wrap{height:280px;break-inside:avoid}
  .timeline,.period{break-inside:avoid}
  .period .age-col{background:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="site-head">
    <a class="home-link" href="./">金融データ・計算ツール</a>
  </div>
  <div class="page-head">
    <div class="page-title">
      <h1>年金受給開始年齢別 損益分岐点シミュレーター</h1>
      <p class="sub">65歳開始（緑色）を基準とした累積受取総額の比較</p>
    </div>
    <div class="page-tools">
      <span data-theme-toggle></span>
      <div class="share-wrap">
        <button class="share-btn" id="shareBtn" type="button">試算結果を共有</button>
        <span id="shareMsg" class="share-msg" aria-live="polite"></span>
      </div>
      <span id="shareQr" class="share-qr" aria-hidden="true" title="スマートフォンのカメラで読み取ると、同じ条件の試算結果がそのまま開けます"></span>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <div class="ctrl">
        <div class="ctrl-head">
          <label>想定利回り<span class="help" tabindex="0" aria-label="想定利回りについて" aria-describedby="yieldTip">？<span class="tipbox" id="yieldTip" role="tooltip">名目の想定利回りです。0.0%〜10.0%の範囲で設定できます。NISAなど非課税口座での運用を想定している場合は、右の「課税あり」のチェックを外してください。</span></span></label>
          <label class="tax-inline">
            <span class="switch">
              <input type="checkbox" id="taxToggle" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </span>
            課税あり
          </label>
        </div>
        <div class="srow">
          <input type="range" id="rSlider" min="0" max="10" step="0.1" value="0">
          <span class="sval"><span id="rVal">0.0</span>%</span>
        </div>
        <div class="ssub">税引後: <span id="rAfter">0.00</span>%<span id="rTaxNote">（課税率 20.315%）</span></div>
      </div>
      <div class="ctrl">
        <label>投資期間終了年齢<span class="help" tabindex="0" aria-label="投資期間終了年齢について" aria-describedby="endAgeTip">？<span class="tipbox" id="endAgeTip" role="tooltip">設定した年齢までは年金を全額運用に回します。投資期間終了後は、65歳受給開始時の年金額を生活費の基準とし、実際の年金額がこれより少ない場合は不足分を運用残高から取り崩して充当します（残高がなくなれば、以降は実際の年金額のみで生活）。多い場合は超過分を運用残高に上乗せして運用を続けます。</span></span></label>
        <div class="srow">
          <input type="range" id="iSlider" min="60" max="80" step="1" value="65">
          <span class="sval"><span id="iVal">65</span>歳</span>
        </div>
        <div class="ssub">以降は基準額（65歳受給時）との過不足を運用残高で調整。</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="chart-wrap"><canvas id="chart" role="img" aria-label="受給開始年齢別（60歳・65歳・70歳・75歳）の累積受取総額の推移。詳細は下の表を参照"></canvas></div>
  </div>

  <div class="card">
    <div class="sec-title">有利な受給開始年齢の推移（累積受取総額ベース）</div>
    <div class="timeline" id="timeline"></div>
    <p class="foot">
      繰上げ減額率: 0.4%/月（最大24%減）｜繰下げ増額率: 0.7%/月（最大84%増）<br>
      65歳受給開始の年金額を100%とすると、各受給開始年齢の年金額は60歳：76%、70歳：142%、75歳：184%になります。<br>
      ※ 物価スライド・加給年金・在職老齢年金等は未考慮。
    </p>
  </div>
</div>

<script>
/* ── Constants ───────────────────────────── */
const TAX_RATE=0.20315, MINA=60, MAXA=100, CALCA=140;
const MAPM=(CALCA-MINA)*12;

// 色は上の <style> の --sc-* で定義している（ライト／ダークの2値）。
// テーマが変わると変わるので、描画のたびに Theme.color() で読み直す。
const SC=[
  {age:60,label:'60歳開始',token:'--sc-60',dashed:false},
  {age:65,label:'65歳開始',token:'--sc-65',dashed:false},
  {age:70,label:'70歳開始',token:'--sc-70',dashed:false},
  {age:75,label:'75歳開始',token:'--sc-75',dashed:false},
];
function scColor(sc){ return Theme.color(sc.token); }
function scBg(sc){ return Theme.color(sc.token + '-bg'); }

/* ── Pension rate ────────────────────────── */
function pRate(a){
  if(a<65)return 1-0.004*(65-a)*12;
  if(a>65)return Math.min(1+0.007*(a-65)*12,1.84);
  return 1;
}

/* ── Wealth array (monthly) ─────────────── */
function calcW(sa,nr,ia,tax){
  const mr=Math.pow(1+nr*(1-tax),1/12)-1;
  const mp=pRate(sa)/12;
  const base=pRate(65)/12;   // 生活費の基準＝65歳受給開始時の年金額
  const sm=(sa-MINA)*12, im=(ia-MINA)*12;
  let pool=0,spent=0;
  const w=new Float64Array(MAPM+1);
  for(let m=0;m<=MAPM;m++){
    w[m]=spent+pool;           // 記録：この月の年金受取り前の残高
    if(m>=sm){
      if(m<im){
        pool=(pool+mp)*(1+mr);
      } else if(mp>=base){
        // 基準額を超える分（繰下げの増加分）は運用に上乗せ
        spent+=base;
        pool=(pool+(mp-base))*(1+mr);
      } else {
        // 基準額に満たない分（繰上げの減少分）は運用残高から取り崩して充当
        const draw=Math.min(base-mp,pool);
        spent+=mp+draw;
        pool=(pool-draw)*(1+mr);
      }
    }
  }
  return w;
}

/* ── Formatting ─────────────────────────── */
function fmtAge(a){
  const y=Math.floor(a), m=Math.round((a-y)*12);
  if(m<=0)  return `${y}歳`;
  if(m>=12) return `${y+1}歳`;
  return `${y}歳${m}ヶ月`;
}

/* ── Overall leader timeline ─────────────
   Returns [{start, end, idx}] sorted by start age.
   idx = index into SC array of who leads in that period.
────────────────────────────────────────── */
function leaderTimeline(ws){
  const periods=[];
  let leader=-1;

  for(let m=0;m<=MAPM;m++){
    // Find argmax across all scenarios
    let best=0;
    for(let i=1;i<ws.length;i++) if(ws[i][m]>ws[best][m]) best=i;

    if(best!==leader){
      let transAge=MINA+m/12;

      if(leader!==-1 && m>0){
        // Interpolate precise crossover between old leader and new best
        const p=ws[leader][m-1]-ws[best][m-1];
        const c=ws[leader][m]  -ws[best][m];
        if(p>0 && (p-c)>1e-10){
          const f=Math.max(0,Math.min(1,p/(p-c)));
          transAge=MINA+(m-1+f)/12;
        }
        periods[periods.length-1].end=transAge;
      } else {
        // Very first period — start at MINA
        transAge=MINA;
      }

      periods.push({start:transAge, end:CALCA, idx:best});
      leader=best;
    }
  }
  return periods;
}

/* ── Marker plugin ───────────────────────
   Draws vertical dashed lines + circles at leader-transition ages.
────────────────────────────────────────── */
const markerPlugin={
  id:'mpl',
  afterDatasetsDraw(chart){
    const markers=chart.options.plugins?.mpl?.data;
    if(!markers||!markers.length)return;
    const{ctx,scales:{x,y}}=chart;
    ctx.save();
    [...markers].sort((a,b)=>a.age-b.age).forEach((mk,idx)=>{
      if(mk.age<x.min||mk.age>x.max)return;
      const px=x.getPixelForValue(mk.age);
      const py=y.getPixelForValue(mk.wealth);
      // Vertical dash
      ctx.beginPath(); ctx.setLineDash([3,4]);
      ctx.strokeStyle=mk.color+'99'; ctx.lineWidth=1;
      ctx.moveTo(px,y.top); ctx.lineTo(px,y.bottom); ctx.stroke();
      ctx.setLineDash([]);
      // Outer ring（中を地の色で抜いて、線と重なっても丸が読めるようにする）
      ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2);
      ctx.fillStyle=Theme.color('--surface'); ctx.fill();
      ctx.strokeStyle=mk.color; ctx.lineWidth=2.5; ctx.stroke();
      // Inner dot
      ctx.beginPath(); ctx.arc(px,py,2.5,0,Math.PI*2);
      ctx.fillStyle=mk.color; ctx.fill();
      // Age label (staggered to avoid overlap)
      const lx=Math.max(x.left+28,Math.min(px,x.right-28));
      const ly=y.top+12+(idx%2)*14;
      ctx.fillStyle=mk.color;
      ctx.font='bold 10px "Helvetica Neue","Hiragino Sans",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(fmtAge(mk.age),lx,ly);
    });
    ctx.restore();
  }
};
Chart.register(markerPlugin);

/* ── Main render ─────────────────────────── */
let myChart=null;

function render(){
  const nr=Number(document.getElementById('rSlider').value)/100;
  const ia=Number(document.getElementById('iSlider').value);
  const taxOn=document.getElementById('taxToggle').checked;
  const tax=taxOn?TAX_RATE:0;

  // Update labels
  document.getElementById('rVal').textContent   =(nr*100).toFixed(1);
  document.getElementById('rAfter').textContent =(nr*(1-tax)*100).toFixed(2);
  document.getElementById('rTaxNote').textContent=taxOn?`（課税率 ${(TAX_RATE*100).toFixed(3)}%）`:'（非課税）';
  document.getElementById('iVal').textContent   =ia;

  // Compute wealth arrays
  const ws=SC.map(s=>calcW(s.age,nr,ia,tax));

  // Overall leader timeline
  const periods=leaderTimeline(ws);

  // Markers: placed at each leader-change transition (periods[1].start, periods[2].start, ...)
  const markers=periods.slice(1).flatMap(p=>{
    if(p.start>=MAXA) return [];
    const m=Math.min(Math.round((p.start-MINA)*12), MAPM);
    const wealth=ws[p.idx][m];
    return[{age:p.start, wealth, color:scColor(SC[p.idx])}];
  });

  // Chart datasets — use {x,y} so linear x-axis displays correctly
  const chartAges=Array.from({length:MAXA-MINA+1},(_,j)=>MINA+j);
  const datasets=SC.map((sc,i)=>({
    label:sc.label,
    data:chartAges.map(a=>({x:a, y:+(ws[i][(a-MINA)*12].toFixed(3))})),
    borderColor:scColor(sc),
    backgroundColor:'transparent',
    borderWidth:2.5,
    pointRadius:0,
    pointStyle:sc.dashed?'dash':'line',
    tension:0,
    borderDash:sc.dashed?[7,4]:[],
  }));

  if(!myChart){
    // 軸・凡例・ツールチップの色は生成時にしか設定されないので、
    // テーマが変わったときは下の Theme.onChange でグラフごと作り直す
    const cSub=Theme.color('--text-sub'), cGrid=Theme.color('--grid');
    myChart=new Chart(document.getElementById('chart'),{
      type:'line',
      data:{datasets},
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:200},
        interaction:{mode:'index', intersect:false},
        scales:{
          x:{
            type:'linear', min:MINA, max:MAXA,
            ticks:{
              stepSize:5,
              callback:v=>`${v}歳`,   // v is the actual numeric age here
              font:{size:11}, color:cSub, maxRotation:0,
            },
            grid:{color:cGrid},
            border:{color:cGrid},
          },
          y:{
            min:0,
            ticks:{font:{size:11}, color:cSub},
            grid:{color:cGrid},
            border:{color:cGrid},
            title:{display:true, text:'累積受取総額（年金年額＝1基準）', font:{size:11}, color:cSub},
          },
        },
        plugins:{
          tooltip:{
            callbacks:{
              title:items=>`${items[0].parsed.x}歳`,
              label:item =>`${item.dataset.label}：${item.parsed.y.toFixed(2)}年分`,
            },
            titleFont:{size:12}, bodyFont:{size:11},
            backgroundColor:Theme.color('--tooltip-bg'),
            titleColor:Theme.color('--tooltip-text'),
            bodyColor:Theme.color('--tooltip-text'),
          },
          legend:{labels:{font:{size:12}, usePointStyle:true, boxWidth:36, boxHeight:8, padding:14, color:cSub}},
          mpl:{data:markers},
        },
      },
    });
  } else {
    myChart.data.datasets=datasets;
    myChart.options.plugins.mpl.data=markers;
    myChart.update('none');
  }

  /* ── Build timeline rows (100歳以内のみ表示) ── */
  const visiblePeriods=periods.filter(p=>p.start<MAXA);
  const tl=document.getElementById('timeline');
  tl.innerHTML=visiblePeriods.map((p,i)=>{
    const sc=SC[p.idx];
    const isFirst=(i===0);
    const isLast =(i===visiblePeriods.length-1);
    // 終端が100歳を超える場合は「〇歳以降（100歳まで）」と表示
    const endCapped=Math.min(p.end, MAXA);

    let rangeText;
    if(isFirst && isLast){
      rangeText=`〜${MAXA}歳まで`;
    } else if(isFirst){
      rangeText=`〜${fmtAge(endCapped)}まで`;
    } else if(isLast){
      rangeText=p.end>MAXA
        ? `${fmtAge(p.start)}〜${MAXA}歳`
        : `${fmtAge(p.start)}以降`;
    } else {
      rangeText=`${fmtAge(p.start)}〜${fmtAge(endCapped)}`;
    }

    return `<div class="period" style="border-color:${scColor(sc)};background:${scBg(sc)}">
      <span class="age-col">${rangeText}</span>
      <span class="winner-col" style="color:${scColor(sc)}">${sc.label}が最も有利</span>
    </div>`;
  }).join('');

  // 条件が変わったら共有用QRコードも描き直す
  Share.refreshQr();
}

document.getElementById('rSlider').addEventListener('input',render);
document.getElementById('iSlider').addEventListener('input',render);
document.getElementById('taxToggle').addEventListener('change',render);

/* ---------- 共有 ---------- */
function collectState(){
  return {
    r: document.getElementById('rSlider').value,
    i: document.getElementById('iSlider').value,
    t: document.getElementById('taxToggle').checked ? 1 : 0,
  };
}
function buildShareUrl(){
  const params=new URLSearchParams();
  const s=collectState();
  for(const k in s) params.set(k,s[k]);
  return Share.urlWithParams(params);
}
Share.init({ buildUrl: buildShareUrl });

/* ---------- 初期化（URLパラメータがあれば復元） ---------- */
(function loadFromURL(){
  const q=new URLSearchParams(location.search);
  if(q.has('r')) document.getElementById('rSlider').value=q.get('r');
  if(q.has('i')) document.getElementById('iSlider').value=q.get('i');
  if(q.has('t')) document.getElementById('taxToggle').checked=q.get('t')==='1';
})();

render();

// グラフはCSS変数に自動では追従しない。scales / legend の色は生成時にしか
// 設定されないため update() では足りず、作り直す（render はDOMから状態を読み直す）
// テーマが変わったら、軸・凡例・ツールチップの色を差し替えて描き直す。
// グラフを作り直さないのは、生成直後の描画がアニメーション経由で非同期になり、
// 印刷時に beforeprint の中で描き終わらず白紙になってしまうため。
Theme.onChange(()=>{
  if(myChart){
    const cSub=Theme.color('--text-sub'), cGrid=Theme.color('--grid');
    const o=myChart.options;
    o.scales.x.ticks.color=cSub; o.scales.x.grid.color=cGrid; o.scales.x.border.color=cGrid;
    o.scales.y.ticks.color=cSub; o.scales.y.grid.color=cGrid; o.scales.y.border.color=cGrid;
    o.scales.y.title.color=cSub;
    o.plugins.legend.labels.color=cSub;
    o.plugins.tooltip.backgroundColor=Theme.color('--tooltip-bg');
    o.plugins.tooltip.titleColor=Theme.color('--tooltip-text');
    o.plugins.tooltip.bodyColor=Theme.color('--tooltip-text');
    myChart.resize();   // 印刷直前は .printing で幅が変わっているので測り直す
  }
  render();             // 線の色とマーカーの色を取り直して update('none') する
});
</script>
</body>
</html>
